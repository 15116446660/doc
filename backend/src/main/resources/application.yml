server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: document-review-system

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/review_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
        login-username: admin
        login-password: admin123

  # Flyway数据库迁移配置
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0
  
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
  
  mail:
    host: smtp.qq.com
    port: 587
    username: your-email@qq.com
    password: your-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.biaoshu.documentreview.entity

# JWT配置
jwt:
  secret: biaoshu-document-review-jwt-secret-key-2024
  expiration: 86400000 # 24小时
  refresh-expiration: 604800000 # 7天

# 文件存储配置
file:
  upload:
    path: /data/uploads/
    max-size: 100MB
    allowed-types: pdf,doc,docx,txt,md,xlsx,xls,ppt,pptx

# 评审系统配置
review:
  # 默认SLA时间(小时)
  default-sla-hours: 24
  # 自动分派开关
  auto-assignment-enabled: true
  # 收敛闸门开关
  convergence-gate-enabled: true
  # AI分析开关
  ai-analysis-enabled: true
  # 最大并发评审数
  max-concurrent-reviews: 10
  workflow:
    default-timeout: 72 # 默认审核超时时间（小时）
    reminder-intervals: 24,48,72 # 提醒间隔（小时）
    max-parallel-reviewers: 5 # 最大并行审核人数

  ai:
    enabled: true
    max-tokens: 4000
    temperature: 0.3

# 日志配置
logging:
  level:
    com.biaoshu.documentreview: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/document-review.log
    max-size: 10MB
    max-history: 30

# Actuator监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Swagger配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.biaoshu.documentreview.controller

# 跨域配置
cors:
  allowed-origins: http://localhost:5173,http://localhost:3000,http://localhost:5174
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# 应用配置
app:
  name: 企业文档质量评审系统
  version: 1.0.0
  description: 基于AI的企业文档质量评审系统

  # 文件存储配置
  file:
    storage:
      type: minio # local, minio, oss
      base-path: /data/review-system/files
      max-size: 100MB
      allowed-extensions:
        - pdf
        - doc
        - docx
        - xls
        - xlsx
        - ppt
        - pptx
        - txt
        - md
        - jpg
        - jpeg
        - png
        - gif

  # MinIO配置
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: review-system

  # OnlyOffice配置
  onlyoffice:
    document-server-url: http://localhost:8080
    jwt-secret: onlyoffice-jwt-secret-2024
    callback-url: /api/v1/onlyoffice/callback
    storage-url: /api/v1/files

  # AI配置
  ai:
    enabled: true
    provider: dashscope # dashscope, openai, custom
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-api-key}
      model: qwen-plus
      max-tokens: 2000
      temperature: 0.7

  # 通知配置
  notification:
    enabled: true
    channels:
      email:
        enabled: true
        smtp:
          host: smtp.example.com
          port: 587
          username: noreply@example.com
          password: password
      sms:
        enabled: false
      webhook:
        enabled: true
