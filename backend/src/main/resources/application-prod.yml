# 生产环境配置
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  datasource:
    # 生产环境建议使用MySQL或PostgreSQL
    url: ${DATABASE_URL:jdbc:h2:file:./data/proddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      pool-name: DocumentReviewHikariCP
      minimum-idle: 10
      maximum-pool-size: 50

  jpa:
    database-platform: ${DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false

  h2:
    console:
      enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:100MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}
      enabled: true

# 日志配置
logging:
  level:
    root: WARN
    com.biaoshu.documentreview: INFO
  file:
    name: ${LOG_FILE:logs/application.log}
    max-size: 100MB
    max-history: 30

# JWT配置
jwt:
  secret: ${JWT_SECRET:biaoshu-document-review-prod-secret-key-2024}
  expiration: ${JWT_EXPIRATION:86400000}

# 跨域配置
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://yourdomain.com}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# 应用配置
app:
  name: 标书审查系统
  version: 1.0.0
  description: 基于AI的智能标书审查与管理系统
  file:
    upload-dir: ${UPLOAD_DIR:/app/uploads}

# Swagger配置 (生产环境建议关闭)
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized